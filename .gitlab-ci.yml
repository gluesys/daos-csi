#
# Phase 0 pipeline: only what runs without a DAOS cluster or a Kubernetes
# cluster. Do not add a job that silently skips when those are missing.
stages: [check, image]

default:
  image: python:3.12-slim
  tags: [Flexa]
  interruptible: true

variables:
  GIT_DEPTH: "20"

syntax:
  stage: check
  script:
    - find . -path ./.git -prune -o -name '*.sh' -print | xargs -r -n1 bash -n
    - find . -path ./.git -prune -o -name '*.py' -print | xargs -r -n50 python3 -m py_compile
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

license-headers:
  stage: check
  script:
    - test -f LICENSE && test -f NOTICE
    - |
      sources=$(find . -path ./.git -prune -o -path ./third_party -prune -o \
        \( -name '*.py' -o -name '*.sh' -o -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.go' -o -name 'Dockerfile*' \) -print)
      missing=$(for f in $sources; do
          head -5 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0' || echo "$f";
        done)
      if [ -n "$missing" ]; then echo "SPDX header missing in:"; echo "$missing"; exit 1; fi
      echo "SPDX headers present in all $(echo "$sources" | wc -w) sources"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

go-build:
  stage: check
  image: golang:1.26
  variables:
    GOTOOLCHAIN: auto
    GOFLAGS: -buildvcs=false
  script:
    - go build ./...
    - go vet ./...
    - gofmt -l cmd pkg | tee /tmp/gofmt.txt; test ! -s /tmp/gofmt.txt
    - go test ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# driver image on the exa-build runner (shell + podman); same registry quirks as daos-operator
image-csi:
  stage: image
  tags: [daos-build]
  needs:
    - job: go-build
      optional: true
  before_script:
    - export REG="${CI_REGISTRY%%:*}"
    - export IMG="$REG/$CI_PROJECT_PATH/daos-csi"
    - export VERSION=$(cat VERSION)
    # the daos-client base image lives in the internal registry: log in before the build too
    - echo "$CI_REGISTRY_PASSWORD" | podman login --username "$CI_REGISTRY_USER" --password-stdin "$REG"
    - |
      push() { for i in 1 2 3; do
        echo "$CI_REGISTRY_PASSWORD" | podman login --username "$CI_REGISTRY_USER" --password-stdin "$REG" >/dev/null && podman push "$1" && return 0
        echo "push $1 failed (attempt $i)"; sleep 10; done; return 1; }
  script:
    - podman build --pull -t "$IMG:$CI_COMMIT_SHORT_SHA" .
    - podman tag "$IMG:$CI_COMMIT_SHORT_SHA" "$IMG:$VERSION"
    - podman tag "$IMG:$CI_COMMIT_SHORT_SHA" "$IMG:latest"
    - push "$IMG:$CI_COMMIT_SHORT_SHA"
    - push "$IMG:$VERSION"
    - push "$IMG:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
