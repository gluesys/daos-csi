apiVersion: v1
kind: ServiceAccount
metadata:
  name: daos-csi-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: daos-csi-node
---
# external-provisioner needs (PV/PVC/StorageClass/events/CSINode) + our driver needs the DAOS CRDs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daos-csi-controller
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, watch, list, delete, update, create]
  - apiGroups: [daos.gluesys.com]
    resources: [daoscontainers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [daos.gluesys.com]
    resources: [daospools]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daos-csi-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daos-csi-controller
subjects:
  - kind: ServiceAccount
    name: daos-csi-controller
    namespace: daos-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: daos-csi-node
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: daos-csi-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: daos-csi-node
subjects:
  - kind: ServiceAccount
    name: daos-csi-node
    namespace: daos-system
